name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: sudo apt-get install -y poppler-utils
      - run: python3 .github/scripts/test_check_opf.py
      - run: python3 .github/scripts/check_opf.py . --strict
